name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: Package all supported targets without publishing
        run: python3 scripts/package.py --version v0.0.0 --commit "$GITHUB_SHA"
      - name: Native binary smoke test
        shell: bash
        run: |
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64) platform=linux_amd64 ;;
            Darwin/arm64) platform=darwin_arm64 ;;
            Darwin/x86_64) platform=darwin_amd64 ;;
            *) exit 1 ;;
          esac
          mkdir -p dist/smoke
          tar -xzf "dist/mobterm-cli_v0.0.0_${platform}.tar.gz" -C dist/smoke
          dist/smoke/mobterm-cli version
