name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: sh -n install.sh
      - name: Package all supported targets without publishing
        run: python3 scripts/package.py --version v0.0.0 --commit "$GITHUB_SHA"
      - name: Offline installer regression and native package smoke test
        run: python3 tests/install_test.py --dist dist --commit "$GITHUB_SHA"
