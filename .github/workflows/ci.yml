name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  public-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks 8.30.1
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 -o scanner.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  scanner.tar.gz' | sha256sum --check --status
          tar -xzf scanner.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: python3 tests/public_boundary_test.py
      - run: python3 scripts/check-public-boundary.py --github-event

  package:
    needs: public-boundary
    name: Build installer test packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
      - run: python3 scripts/package.py --version v0.0.0 --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-test-packages
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  test:
    needs: package
    name: Native ${{ matrix.goos }}/${{ matrix.goarch }} (${{ matrix.runner }})
    env:
      MOBTERM_REQUIRE_TMUX: '1'
      GO_TEST_TIMEOUT: ${{ matrix.goos == 'darwin' && matrix.goarch == 'amd64' && '45m' || '10m' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
            kernel: Linux
            machine: x86_64
          - runner: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
            kernel: Linux
            machine: aarch64
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            kernel: Linux
            machine: x86_64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            kernel: Linux
            machine: aarch64
          - runner: macos-26-intel
            goos: darwin
            goarch: amd64
            kernel: Darwin
            machine: x86_64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            kernel: Darwin
            machine: x86_64
          - runner: macos-15
            goos: darwin
            goarch: arm64
            kernel: Darwin
            machine: arm64
          - runner: macos-26
            goos: darwin
            goarch: arm64
            kernel: Darwin
            machine: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify native runner and Go host architecture
        shell: bash
        env:
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
          EXPECTED_KERNEL: ${{ matrix.kernel }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          uname -sm
          go version
          go env GOHOSTOS GOHOSTARCH GOOS GOARCH
          test "$(uname -s)" = "$EXPECTED_KERNEL"
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$(go env GOHOSTOS)" = "$EXPECTED_GOOS"
          test "$(go env GOHOSTARCH)" = "$EXPECTED_GOARCH"
          test "$(go env GOOS)" = "$EXPECTED_GOOS"
          test "$(go env GOARCH)" = "$EXPECTED_GOARCH"
          if [[ "$EXPECTED_GOOS" == darwin ]]; then
            test "$(sysctl -in sysctl.proc_translated)" != 1
          fi
      - name: Install live tmux test dependency
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y tmux
          elif ! command -v tmux >/dev/null 2>&1; then
            brew install tmux
          fi
          tmux -V
      - run: test -z "$(gofmt -l .)"
      - run: go test -timeout="$GO_TEST_TIMEOUT" -count=1 -v ./...
      - run: go vet ./...
      - run: go test -race -timeout="$GO_TEST_TIMEOUT" -count=1 -v ./...
      - name: Build and run native binary
        run: |
          go build -trimpath -o mobterm-cli .
          ./mobterm-cli version
      - name: Select reproducible historical Agent samples
        shell: bash
        run: |
          python3 tests/select_agent_samples.py historical >> "$GITHUB_ENV"
      - name: Install pinned native Agents in an isolated prefix
        shell: bash
        env:
          HOME: ${{ runner.temp }}/mobterm-agent-home
          CODEX_HOME: ${{ runner.temp }}/mobterm-agent-home/.codex
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/mobterm-agent-home/.claude
          DISABLE_AUTOUPDATER: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: |
          mkdir -p "$HOME" "$CODEX_HOME" "$CLAUDE_CONFIG_DIR"
          npm install --global --prefix "$RUNNER_TEMP/mobterm-agents" --no-audit --no-fund \
            "@openai/codex@$CODEX_TEST_VERSION" "@anthropic-ai/claude-code@$CLAUDE_TEST_VERSION"
          echo "$RUNNER_TEMP/mobterm-agents/bin" >> "$GITHUB_PATH"
      - name: Real Agent lifecycle and configuration regression
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            python3 tests/linux_lifecycle_test.py --binary ./mobterm-cli \
              --expect-codex-version "$CODEX_TEST_VERSION" --expect-claude-version "$CLAUDE_TEST_VERSION" -v
          else
            python3 tests/linux_lifecycle_test.py --binary ./mobterm-cli --config-only --agent-prefix "$RUNNER_TEMP/mobterm-agents" \
              --expect-codex-version "$CODEX_TEST_VERSION" --expect-claude-version "$CLAUDE_TEST_VERSION" -v
          fi
      - run: sh -n install.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installer-test-packages
          path: dist
      - name: Offline installer regression and native package smoke test
        run: python3 tests/install_test.py --dist dist --commit "$GITHUB_SHA"

  compatibility:
    name: Agent compatibility (${{ matrix.sample }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sample: minimum
            runner: ubuntu-24.04
          - sample: current
            runner: ubuntu-24.04
          - sample: macos-config
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check sample selection and macOS preflight regressions
        run: |
          python3 tests/select_agent_samples_test.py -v
          python3 tests/darwin_codex_test.py -v
      - name: Select fixed compatibility endpoints
        env:
          SAMPLE: ${{ matrix.sample }}
        run: |
          python3 tests/select_agent_samples.py "$SAMPLE" >> "$GITHUB_ENV"
      - name: Check sample consistency and build
        run: |
          go test -count=1 -run TestCompatibilitySamplesMatchPolicy ./...
          go build -trimpath -o mobterm-cli .
      - name: Install exact native Agent samples in an isolated prefix
        env:
          HOME: ${{ runner.temp }}/mobterm-agent-home
          CODEX_HOME: ${{ runner.temp }}/mobterm-agent-home/.codex
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/mobterm-agent-home/.claude
          DISABLE_AUTOUPDATER: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: |
          mkdir -p "$HOME" "$CODEX_HOME" "$CLAUDE_CONFIG_DIR"
          npm install --global --prefix "$RUNNER_TEMP/mobterm-agents" --no-audit --no-fund \
            "@openai/codex@$CODEX_TEST_VERSION" "@anthropic-ai/claude-code@$CLAUDE_TEST_VERSION"
          echo "$RUNNER_TEMP/mobterm-agents/bin" >> "$GITHUB_PATH"
      - name: Real Agent lifecycle, configuration and local HTTPS regression
        shell: bash
        run: |
          args=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            args+=(--config-only --agent-prefix "$RUNNER_TEMP/mobterm-agents")
          fi
          python3 tests/linux_lifecycle_test.py --binary ./mobterm-cli "${args[@]}" \
            --expect-codex-version "$CODEX_TEST_VERSION" --expect-claude-version "$CLAUDE_TEST_VERSION" -v
      - name: Real asdf and Node launcher isolation regression
        if: matrix.sample == 'minimum' && runner.os == 'Linux'
        run: |
          python3 tests/asdf_probe_test.py --binary ./mobterm-cli \
            --work-dir "$RUNNER_TEMP/mobterm-asdf-probe"

      - name: Native OpenCode and Pi adapter contracts
        run: |
          npm ci --prefix scripts/native-adapter-tests --ignore-scripts --no-audit --no-fund
          node scripts/test-native-adapters.mjs
      - name: Install official TUI compatibility endpoints
        env:
          HOME: ${{ runner.temp }}/mobterm-native-home
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/mobterm-native-home/pi
          PI_OFFLINE: '1'
          PI_SKIP_VERSION_CHECK: '1'
          OPENCODE_DISABLE_AUTOUPDATE: '1'
        run: |
          mkdir -p "$HOME" "$PI_CODING_AGENT_DIR"
          npm install --prefix "$RUNNER_TEMP/mobterm-native-hosts" --no-audit --no-fund \
            "@opencode/cli@$OPENCODE_TEST_VERSION" "@earendil-works/pi-coding-agent@$PI_TEST_VERSION" \
            "@earendil-works/chord@$PI_TEST_VERSION" "@earendil-works/pi-agent-core@$PI_TEST_VERSION" \
            "@earendil-works/pi-ai@$PI_TEST_VERSION" "@earendil-works/pi-codemode@$PI_TEST_VERSION" \
            "@earendil-works/pi-mcp@$PI_TEST_VERSION" "@earendil-works/pi-tui@$PI_TEST_VERSION"
      - name: Load generated adapters in official hosts without model credentials
        run: |
          python3 scripts/test-native-adapters-host.py opencode \
            "$RUNNER_TEMP/mobterm-native-hosts/node_modules/.bin/opencode" \
            ./mobterm-cli "$OPENCODE_TEST_VERSION"
          python3 scripts/test-native-adapters-host.py pi \
            "$RUNNER_TEMP/mobterm-native-hosts/node_modules/.bin/pi" \
            ./mobterm-cli "$PI_TEST_VERSION" \
            "$RUNNER_TEMP/mobterm-native-hosts/node_modules/@earendil-works/pi-coding-agent"
