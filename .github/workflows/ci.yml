name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: Native ${{ matrix.goos }}/${{ matrix.goarch }} (${{ matrix.runner }})
    env:
      MOBTERM_REQUIRE_TMUX: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
            kernel: Linux
            machine: x86_64
          - runner: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
            kernel: Linux
            machine: aarch64
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            kernel: Linux
            machine: x86_64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            kernel: Linux
            machine: aarch64
          - runner: macos-26-intel
            goos: darwin
            goarch: amd64
            kernel: Darwin
            machine: x86_64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            kernel: Darwin
            machine: x86_64
          - runner: macos-15
            goos: darwin
            goarch: arm64
            kernel: Darwin
            machine: arm64
          - runner: macos-26
            goos: darwin
            goarch: arm64
            kernel: Darwin
            machine: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify native runner and Go host architecture
        shell: bash
        env:
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
          EXPECTED_KERNEL: ${{ matrix.kernel }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          uname -sm
          go version
          go env GOHOSTOS GOHOSTARCH GOOS GOARCH
          test "$(uname -s)" = "$EXPECTED_KERNEL"
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$(go env GOHOSTOS)" = "$EXPECTED_GOOS"
          test "$(go env GOHOSTARCH)" = "$EXPECTED_GOARCH"
          test "$(go env GOOS)" = "$EXPECTED_GOOS"
          test "$(go env GOARCH)" = "$EXPECTED_GOARCH"
          if [[ "$EXPECTED_GOOS" == darwin ]]; then
            test "$(sysctl -in sysctl.proc_translated)" != 1
          fi
      - name: Install live tmux test dependency
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y tmux
          elif ! command -v tmux >/dev/null 2>&1; then
            brew install tmux
          fi
          tmux -V
      - run: test -z "$(gofmt -l .)"
      - run: go test -count=1 -v ./...
      - run: go vet ./...
      - run: go test -race -count=1 -v ./...
      - name: Build and run native binary
        run: |
          go build -trimpath -o mobterm-cli .
          ./mobterm-cli version
      - name: Select reproducible historical Agent samples
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os
          samples = json.load(open('testdata/compatibility-samples.json'))['historical']
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              for agent, version in samples.items():
                  print(f'{agent.upper()}_TEST_VERSION={version}', file=out)
          PYTHON
      - name: Install pinned native Agents in an isolated prefix
        shell: bash
        env:
          HOME: ${{ runner.temp }}/mobterm-agent-home
          CODEX_HOME: ${{ runner.temp }}/mobterm-agent-home/.codex
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/mobterm-agent-home/.claude
          DISABLE_AUTOUPDATER: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: |
          mkdir -p "$HOME" "$CODEX_HOME" "$CLAUDE_CONFIG_DIR"
          npm install --global --prefix "$RUNNER_TEMP/mobterm-agents" --no-audit --no-fund \
            "@openai/codex@$CODEX_TEST_VERSION" "@anthropic-ai/claude-code@$CLAUDE_TEST_VERSION"
          echo "$RUNNER_TEMP/mobterm-agents/bin" >> "$GITHUB_PATH"
      - name: Real Agent lifecycle and configuration regression
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            python3 tests/linux_lifecycle_test.py --binary ./mobterm-cli \
              --expect-codex-version "$CODEX_TEST_VERSION" --expect-claude-version "$CLAUDE_TEST_VERSION" -v
          else
            python3 tests/linux_lifecycle_test.py --binary ./mobterm-cli --config-only \
              --expect-codex-version "$CODEX_TEST_VERSION" --expect-claude-version "$CLAUDE_TEST_VERSION" -v
          fi
      - run: sh -n install.sh
      - name: Package all supported targets without publishing
        run: python3 scripts/package.py --version v0.0.0 --commit "$GITHUB_SHA"
      - name: Offline installer regression and native package smoke test
        run: python3 tests/install_test.py --dist dist --commit "$GITHUB_SHA"

  compatibility:
    name: Agent compatibility (${{ matrix.sample }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sample: minimum
            runner: ubuntu-24.04
          - sample: current
            runner: ubuntu-24.04
          - sample: minimum
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Select fixed compatibility endpoints
        env:
          SAMPLE: ${{ matrix.sample }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          samples = json.load(open('testdata/compatibility-samples.json'))[os.environ['SAMPLE']]
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              for agent, version in samples.items():
                  print(f'{agent.upper()}_TEST_VERSION={version}', file=out)
          PYTHON
      - name: Check sample consistency and build
        run: |
          go test -count=1 -run TestCompatibilitySamplesMatchPolicy ./...
          go build -trimpath -o mobterm-cli .
      - name: Install exact native Agent samples in an isolated prefix
        env:
          HOME: ${{ runner.temp }}/mobterm-agent-home
          CODEX_HOME: ${{ runner.temp }}/mobterm-agent-home/.codex
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/mobterm-agent-home/.claude
          DISABLE_AUTOUPDATER: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: |
          mkdir -p "$HOME" "$CODEX_HOME" "$CLAUDE_CONFIG_DIR"
          npm install --global --prefix "$RUNNER_TEMP/mobterm-agents" --no-audit --no-fund \
            "@openai/codex@$CODEX_TEST_VERSION" "@anthropic-ai/claude-code@$CLAUDE_TEST_VERSION"
          echo "$RUNNER_TEMP/mobterm-agents/bin" >> "$GITHUB_PATH"
      - name: Real Agent lifecycle, configuration and local HTTPS regression
        shell: bash
        run: |
          args=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            args+=(--config-only)
          fi
          python3 tests/linux_lifecycle_test.py --binary ./mobterm-cli "${args[@]}" \
            --expect-codex-version "$CODEX_TEST_VERSION" --expect-claude-version "$CLAUDE_TEST_VERSION" -v
      - name: Real asdf and Node launcher isolation regression
        if: matrix.sample == 'minimum' && runner.os == 'Linux'
        run: |
          python3 tests/asdf_probe_test.py --binary ./mobterm-cli \
            --work-dir "$RUNNER_TEMP/mobterm-asdf-probe"
